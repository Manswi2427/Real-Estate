{% extends 'base.html' %}
{% block title %}Delete {{ property.title }} | RealEstatePortal{% endblock %}

{% block content %}
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="form-card text-center">
                <i class="fa-solid fa-triangle-exclamation fa-3x text-danger mb-3"></i>
                <h3>Delete this listing?</h3>
                <p class="text-muted">You are about to permanently delete <strong>"{{ property.title }}"</strong>. This action cannot be undone.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2 mt-3">
                        <button type="submit" class="btn btn-danger px-4">Yes, Delete It</button>
                        <a href="{% url 'property_detail' property.slug %}" class="btn btn-outline-custom px-4">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
