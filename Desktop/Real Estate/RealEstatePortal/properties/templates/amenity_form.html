{% extends 'base.html' %}
{% block title %}Add Amenity | RealEstatePortal{% endblock %}

{% block content %}
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="form-card">
                <h3 class="section-title">Add New Amenity</h3>
                <p class="section-subtitle">Use a <a href="https://fontawesome.com/icons" target="_blank">Font Awesome</a> class for the icon, e.g. <code>fa-solid fa-wifi</code>.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Name</label>
                        {{ form.name }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Icon Class</label>
                        {{ form.icon }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Description</label>
                        {{ form.description }}
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary-custom px-4">Save Amenity</button>
                        <a href="{% url 'amenity_list' %}" class="btn btn-outline-custom px-4">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
